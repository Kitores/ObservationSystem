version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: logs-postgres
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/storage/postgre/initialize/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mihail -d logsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: